[profile.default]
src = "src"
out = "out"
libs = ["lib"]
script = "script"
remappings = ["@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/"]

[rpc_endpoints]
localhost = "http://127.0.0.1:8545"
botchain = "https://rpc.botchain.ai"
botchain_testnet = "https://rpc.bohr.life"

[etherscan]
botchain = { key = "${ETHERSCAN_API_KEY}", url = "https://scan.botchain.ai/api", chain = 677 }
botchain_testnet = { key = "${ETHERSCAN_API_KEY}", url = "https://scan.bohr.life/api", chain = 968 }
